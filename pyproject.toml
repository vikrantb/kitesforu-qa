[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitesforu-qa"
version = "0.1.0"
description = "Audio & Content Quality Assurance CLI for KitesForU podcasts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "KitesForU Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "openai-whisper>=20231117",
    "jiwer>=3.0.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "google-generativeai>=0.3.0",
    "google-cloud-storage>=2.14.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    # D21 L5.2 (audio-overhaul, 2026-05-29): listen_test verifier needs
    # loudness (pyloudnorm) + STOI (pystoi) + numpy/scipy primitives
    # for music-presence + SFX-transient detection on the final mp3.
    # All four are pure-python wheels; collective <8 MB install.
    "pyloudnorm>=0.1.1",
    "pystoi>=0.4.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    # quality-harness visual battery (qh-check-batteries) reads art.image_paths with Pillow for
    # dimension/blank/text analysis; importable in dev but undeclared = clean-CI import failure.
    "Pillow>=10",
]

[project.optional-dependencies]
diarization = [
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
]
# scorecard.vlm (axis 3, --vlm on short_scorecard.py): provider-agnostic photo-vs-illustration VLM.
# google-generativeai is already a hard dependency (LLMEvaluator); these two are the OpenAI/Anthropic
# legs of the provider chain, imported lazily so a bare install without either stays $0/importable.
vlm = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
all = [
    "kitesforu-qa[diarization,vlm,dev]",
]

[project.scripts]
kqa = "kitesforu_qa.cli:cli"

[project.urls]
Homepage = "https://github.com/vikrantb/kitesforu-qa"
Repository = "https://github.com/vikrantb/kitesforu-qa"
Issues = "https://github.com/vikrantb/kitesforu-qa/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
